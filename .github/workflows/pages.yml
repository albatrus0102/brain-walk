name: deploy pages
on:
  push: { branches: [claude/digital-cognitive-therapy-app-lff0ze] }   # 저장소 기본 브랜치 (github-pages 환경이 이 브랜치만 허용)
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (only public web files)
        run: |
          mkdir _site
          cp -r index.html js styles icons manifest.webmanifest sw.js firebase-config.js _site/
          sed -i "s/^const VERSION = '__BUILD__';/const VERSION = '${GITHUB_SHA::8}';/" _site/sw.js
          grep -q "^const VERSION = '${GITHUB_SHA::8}';" _site/sw.js || { echo "::error::sw.js VERSION was not stamped"; exit 1; }
          touch _site/.nojekyll
      - name: Warn if config is unfilled (site still deploys and shows the setup screen)
        run: grep -q REPLACE_ME _site/firebase-config.js && echo "::warning::firebase-config.js is not filled in" || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
